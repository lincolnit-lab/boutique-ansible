apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: server
          # 1. ОТКУДА СКАЧАТЬ: Официальный образ фронтенда от Google
          image: gcr.io/google-samples/microservices-demo/frontend:v0.10.0

          # 2. КУДА СТУЧАТЬСЯ: Фронтенд магазина по умолчанию работает на порту 8080
          ports:
            - containerPort: 8080

          # 3. НАСТРОЙКИ: Самая важная часть — связываем Фронтенд с вашей Корзиной          env:
            - name: PORT
              value: "8080"
            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"
            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice:7000"
            # ОТКЛЮЧАЕМ ПРОФИЛИРОВЩИК И ДЛЯ ФРОНТЕНДА:
            - name: DISABLE_PROFILER
              value: "1"
            # НОВАЯ ЗАГЛУШКА ДЛЯ ВЕРСИИ v0.10.0 (ФИНАЛЬНЫЙ БОСС):
            - name: SHOPPING_ASSISTANT_SERVICE_ADDR
              value: "localhost:8080"
            # ОСТАЛЬНЫЕ СЛУЖБЫ:
            - name: SHIPPING_SERVICE_ADDR
              value: "localhost:50051"
            - name: RECOMMENDATION_SERVICE_ADDR
              value: "localhost:7000"
            - name: checkout_service_addr
              value: "localhost:5050"
            - name: CHECKOUT_SERVICE_ADDR
              value: "localhost:5050"
            - name: AD_SERVICE_ADDR
              value: "localhost:9555"
          readinessProbe:
            initialDelaySeconds: 15
            httpGet:
              path: "/_healthz" # У фронтенда проверка идет через обычный веб-сайт
              port: 8080
          livenessProbe:
            initialDelaySeconds: 15
            httpGet:
              path: "/_healthz"
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
