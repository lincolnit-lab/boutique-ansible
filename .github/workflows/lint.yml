name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  lint:
    name: 1. Статический анализ (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Чеккаут кода
        uses: actions/checkout@v4

      - name: Запуск Ansible Lint
        uses: ansible-actions/ansible-lint-action@v1.0.3
        with:
          target: deploy.yml  # Оставили вашу рабочу slowed-настройку

  deploy:
    name: 2. Автоматический деплой на ноутбук
    needs: lint
    runs-on: [self-hosted, my-laptop]
    steps:
      - name: Чеккаут актуального кода на ноутбук
        uses: actions/checkout@v4

      - name: Запуск Ansible деплоя локально
        run: |
          ansible-playbook -i hosts.ini deploy.yml --connection=local