name: Проверка Ansible Плейбука

on:
  push:
    branches: [ main ]

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем наш код из репозитория
        uses: actions/checkout@v4

      - name: Запускаем линтер для проверки ошибок
        uses: ansible/ansible-lint-action@v6
